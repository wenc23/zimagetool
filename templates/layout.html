<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b0d0c">
    <meta name="description" content="Z-Image Turbo 本地 AI 图像创作工作室">
    <title>{% block title %}Z/Studio{% endblock %}</title>
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            const theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>

    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}" aria-label="Z Studio 首页">
            <span class="brand-mark"><span>Z</span></span>
            <span class="brand-copy">
                <strong>Z/STUDIO</strong>
                <small>LOCAL IMAGE LAB</small>
            </span>
        </a>

        <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="打开导航" aria-expanded="false">
            <i class="fas fa-bars"></i>
        </button>

        <nav class="site-nav" id="navbarNav" aria-label="主要导航">
            <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">
                <span>01</span> 创作台
            </a>
            <a href="{{ url_for('gallery') }}" class="{% if request.endpoint == 'gallery' %}active{% endif %}">
                <span>02</span> 作品库
            </a>
            <button class="theme-toggle" id="themeToggle" type="button" title="切换主题" aria-label="切换明暗主题">
                <i class="fas fa-sun"></i>
                <span>亮色</span>
            </button>
        </nav>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div>
            <span class="footer-pulse"></span>
            <span>LOCAL-FIRST GENERATIVE STUDIO</span>
        </div>
        <span>Z-IMAGE TURBO · 2026</span>
    </footer>

    <div id="loadingOverlay" class="loading-overlay" aria-live="polite" aria-busy="true">
        <div class="loading-orbit" aria-hidden="true"><span></span></div>
        <div class="loading-copy">
            <strong id="loadingText">正在处理</strong>
            <span id="loadingSubtext">请稍候片刻</span>
        </div>
    </div>

    <script>
        (function () {
            const root = document.documentElement;
            const themeToggle = document.getElementById('themeToggle');
            const menuButton = document.getElementById('mobileMenuBtn');
            const nav = document.getElementById('navbarNav');

            function updateThemeControl() {
                const dark = root.dataset.theme === 'dark';
                const icon = themeToggle?.querySelector('i');
                const label = themeToggle?.querySelector('span');
                if (icon) icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
                if (label) label.textContent = dark ? '亮色' : '暗色';
            }

            themeToggle?.addEventListener('click', () => {
                root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('theme', root.dataset.theme);
                updateThemeControl();
            });

            menuButton?.addEventListener('click', () => {
                const open = nav.classList.toggle('active');
                menuButton.setAttribute('aria-expanded', String(open));
                menuButton.querySelector('i').className = open ? 'fas fa-xmark' : 'fas fa-bars';
            });

            nav?.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
                nav.classList.remove('active');
                menuButton?.setAttribute('aria-expanded', 'false');
            }));

            window.showNotification = function (message, type = 'info') {
                const icons = { success: 'check', error: 'xmark', info: 'sparkles', warning: 'triangle-exclamation' };
                type = Object.hasOwn(icons, type) ? type : 'info';
                const notification = document.createElement('div');
                notification.className = `notification notification-${type}`;
                const iconWrap = document.createElement('span');
                iconWrap.className = 'notification-icon';
                const icon = document.createElement('i');
                icon.className = `fas fa-${icons[type]}`;
                iconWrap.append(icon);
                const text = document.createElement('span');
                text.textContent = message;
                notification.append(iconWrap, text);
                document.body.append(notification);
                requestAnimationFrame(() => notification.classList.add('show'));
                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => notification.remove(), 280);
                }, 3200);
            };

            updateThemeControl();
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
